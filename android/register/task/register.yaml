appId: com.example.flutter_ces
---
- tapOn: "${output.registerPagePom.botones.necesitasRegistrarte}"

- tapOn: "Email"
- inputText: ${EMAIL}

- tapOn:
    text: "Contraseña"
    index: 1
- inputText: ${PASSWORD}

- tapOn:
    id: "0_resource_name_obfuscated"
    index: 48

- tapOn: "${output.registerPagePom.botones.registrarse}"
