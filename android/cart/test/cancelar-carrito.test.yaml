appId: com.example.flutter_ces
tags:
  - carrito
  - medium_priority
---
- runFlow: ../load-data-pom.yaml

- launchApp:
    clearState: true

# 1. iniciar sesion
- runFlow:
    file: ../../login/task/login.yaml
    env:
      EMAIL: "${output.loginData.credencialesExitosas.email}"
      PASSWORD: "${output.loginData.credencialesExitosas.password}"

- waitForAnimationToEnd:
    timeout: 15000

- assertVisible:
    point: 4%,18%

# 2. agregar producto al carrito
- runFlow:
    file: ../task/add-to-cart.yaml

# 3. cancelar carrito
- runFlow:
    file: ../task/cancel-cart.yaml
