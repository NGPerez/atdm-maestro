appId: com.example.flutter_ces
---
- runFlow: ../load-data-pom.yaml

- launchApp:
    clearState: true

# 1. iniciar sesion
- runFlow:
    file: ../../login/task/login.yaml
    env:
      EMAIL: "${output.loginData.credencialesExitosas.email}"
      PASSWORD: "${output.loginData.credencialesExitosas.password}"

- waitForAnimationToEnd:
    timeout: 15000

# 2. validar campos vacios en perfil
- runFlow: 
    file: ../task/validate-profile-fields.yaml
    env:
      NOMBRE: ""
      APELLIDO: ""
      TELEFONO: ""
      FECHA_NACIMIENTO: ""
      DIRECCION: ""
      PAIS: ""