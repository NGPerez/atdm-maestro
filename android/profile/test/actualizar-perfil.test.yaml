appId: com.example.flutter_ces
---
- runFlow: ../load-data-pom.yaml

- launchApp:
    clearState: true

# 1. iniciar sesion
- runFlow:
    file: ../../login/task/login.yaml
    env:
      EMAIL: "${output.loginData.credencialesExitosas.email}"
      PASSWORD: "${output.loginData.credencialesExitosas.password}"

- waitForAnimationToEnd:
    timeout: 15000

- assertVisible:
    point: 4%,18%

# 2. actualizar datos del perfil
- runFlow:
    file: ../task/profile.yaml
    env:
      NOMBRE: "${output.profileData.datosPersonales.nombre}"
      TELEFONO: "${output.profileData.datosPersonales.telefono}"